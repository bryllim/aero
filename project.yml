name: Aero
options:
  bundleIdPrefix: com.bryllim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Aero:
    type: application
    platform: macOS
    sources:
      - Aero
      - path: LICENSE
        buildPhase: resources
      - path: ATTRIBUTION.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryllim.aero
        PRODUCT_NAME: Aero
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: Aero
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Bryl Lim. CC BY 4.0. bryllim.com"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
