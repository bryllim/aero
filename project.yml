name: Aero
options:
  bundleIdPrefix: com.bryllim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Aero:
    type: application
    platform: macOS
    sources: [Aero]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryllim.aero
        PRODUCT_NAME: Aero
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: Aero
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
